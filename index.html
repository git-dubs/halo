<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halo Home Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background-color: #FEB0C9;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FEB0C9;
      background-repeat: repeat;
      background-size: auto;
      color: black;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    .logo {
      width: 150px;
      margin: 20px 0;
    }

    .mural-gif {
      width: 60vw;
      max-width: 800px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      background-color: transparent;
      margin-bottom: 10px;
    }

    .mural-call {
      margin-top: 10px;
    }

    .call-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .call-text {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .call-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background-color: #000;
      color: #FEB0C9;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }

    .contact-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .social-section {
      margin-top: 10px;
    }

    .social-label {
      font-weight: bold;
      margin: 10px 0 10px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .icon-img {
      width: 32px;
      height: 32px;
    }
  </style>
</head>
<body>

  <img src="https://i.imgur.com/GvkTcYF.png" alt="Halo Logo" class="logo" />

  <video class="mural-gif" controls>
    <source src="https://i.imgur.com/MSharTS.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Call to Action -->
  <div class="mural-call">
    <h2 class="call-title">SAVING YOU TIME, ENERGY AND MONEY</h2>
    <p class="call-text">TIRED OF THE MESS? WE HANDLE THE STRESS</p>

    <div class="social-section">
      <div class="social-label">CONTACT US DIRECTLY</div>

      <div class="contact-buttons">
        <a href="tel:+19568008185" class="call-button">
          <img src="Icon/Icon13.png" alt="Call" class="icon-img" />
          Call
        </a>
        <a href="sms:+19568008185" class="call-button">
          <img src="Icon/Icon13.png" alt="Text" class="icon-img" />
          Text
        </a>
          <a href="https://wa.me/19568008185" target="_blank" class="call-button">
          <img src="Icon/Icon13.png" alt="WhatsApp" class="icon-img" />
          WhatsApp
        </a>
      </div>

      <div class="social-label">FOLLOW US ON SOCIAL MEDIA</div>
      <div class="social-icons">
        <a href="https://discord.com/channels/1361860024984539332/1362119865904791793/1392868290933686405" target="_blank">
          <img src="Icon/Icon8.png" alt="Instagram" class="icon-img">
        </a>
        <a href="https://www.facebook.com/profile.php?id=61577920935528&mibextid=wwXIfr&rdid=7UNJOMgWqxG0Ki3O&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F14KnGV6TA4s%2F%3Fmibextid%3DwwXIfr#" target="_blank">
          <img src="Icon/Icon3.png" alt="Facebook" class="icon-img">
        </a>
        <a href="https://www.tiktok.com/@halohomeservices956?_t=ZP-8xuh5IRHbKB&_r=1" target="_blank">
          <img src="Icon/Icon4.png" alt="TikTok" class="icon-img">
        </a>
      </div>
    </div>
  </div>

</body>
</html>
